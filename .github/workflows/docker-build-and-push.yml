name: Docker Build and Push

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never cancel a push half-way through

jobs:
  build-and-push:
    name: Build & push production image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/acquisition

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # QEMU lets the amd64 runner build the linux/arm64 image.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=prod-{{date 'YYYYMMDD-HHmmss' tz='UTC'}}
          labels: |
            org.opencontainers.image.title=acquisition
            org.opencontainers.image.description=Acquisitions API (Express + Neon Postgres)

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## 🐳 Docker image published"
            echo ""
            echo "**Image:** \`${IMAGE_NAME}\`"
            echo "**Platforms:** linux/amd64, linux/arm64"
            echo "**Digest:** \`${DIGEST}\`"
            echo "**Commit:** \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\`"
            echo ""
            echo "### Tags"
            echo "$TAGS" | while read -r tag; do [ -n "$tag" ] && echo "- \`${tag}\`"; done
            echo ""
            echo "### Pull"
            echo '```bash'
            echo "docker pull $(echo "$TAGS" | grep ':latest$' || echo "$TAGS" | head -n1)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
